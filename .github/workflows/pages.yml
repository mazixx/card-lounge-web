name: Deploy Card Lounge Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kiem tra file nguon
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            card_lounge_original.txt \
            convert_engine.py \
            web_controller.py \
            index.html \
            style.css \
            app.js \
            worker.js
          do
            if [ ! -s "$file" ]; then
              echo "::error::Thieu file hoac file rong: $file"
              exit 1
            fi
          done

      - name: Tao engine.py
        shell: bash
        run: |
          set -euo pipefail

          python convert_engine.py
          test -s engine.py
          python -m py_compile engine.py web_controller.py

      - name: Chuan bi website
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site

          cp index.html _site/
          cp style.css _site/
          cp app.js _site/
          cp worker.js _site/
          cp engine.py _site/
          cp web_controller.py _site/

          touch _site/.nojekyll

          test -s _site/engine.py
          test -s _site/web_controller.py

          echo "Cac file se duoc dua len Pages:"
          ls -lah _site

      - name: Cau hinh Pages
        uses: actions/configure-pages@v5

      - name: Tai website len
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Xuat ban website
        id: deployment
        uses: actions/deploy-pages@v4
